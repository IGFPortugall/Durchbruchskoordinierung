<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Durchbruchskoordinierung</title>
<link rel="stylesheet" href="app/stil.css">
<!-- Versionen fest: That Open 3.6, three 0.184, web-ifc 0.0.77 (passend zu That Open) -->
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.184.0",
    "three/": "https://esm.sh/three@0.184.0/",
    "camera-controls": "https://esm.sh/camera-controls@3.1.2?external=three",
    "web-ifc": "https://esm.sh/web-ifc@0.0.77",
    "@thatopen/fragments": "https://esm.sh/@thatopen/fragments@3.6.1?external=three,web-ifc",
    "@thatopen/components": "https://esm.sh/@thatopen/components@3.6.0?external=three,web-ifc,@thatopen/fragments,camera-controls"
  }
}
</script>
</head>
<body>
<header class="kopf">
  <div class="titel"><span id="projektname">Durchbruchskoordinierung</span></div>
  <div class="werkzeuge">
    <div class="segment" title="Ansicht umschalten – Auswahl und Ausschnitt bleiben erhalten">
      <button id="modus-3d" class="an">3D</button><button id="modus-plan">Grundriss</button>
    </div>
    <select id="geschoss" title="Geschoss: im 3D werden darüberliegende Geschosse ausgeblendet, im Grundriss wird 1,00 m über OKFF geschnitten"></select>
    <div class="trenner"></div>
    <button id="schnitt-ebene" title="Schnittebene: danach auf eine Fläche klicken. Die Ebene lässt sich am Pfeil verschieben. Esc bricht ab.">Schnitt setzen</button>
    <button id="schnitt-box" title="Schnittbox um den ausgewählten Durchbruch (sonst um die Bildmitte). Seiten am Pfeil verschieben.">Schnittbox</button>
    <button id="schnitt-weg" title="Alle Schnitte entfernen">Schnitte <span id="schnitt-anzahl">0</span> ×</button>
    <div class="trenner"></div>
    <div id="ebenen-schalter" class="schalter"></div>
  </div>
  <button id="modell-neu" title="IFC-Datei (z. B. Architektur oder Tragwerk) in den Projektordner laden. Sie wird einmalig in Fragments umgewandelt und ist dann für alle sichtbar.">Modell hinzufügen</button>
  <button id="benutzer" class="benutzer" title="Name, Firma und Rolle ändern"></button>
</header>

<main class="haupt">
  <aside class="links">
    <input id="suche" type="search" placeholder="Nummer oder Text suchen">
    <div class="filter">
      <select id="filter-status" title="Nach Gesamtstatus filtern">
        <option value="">Alle Status</option>
        <option value="offen">In Prüfung</option>
        <option value="blockiert">Abgelehnt</option>
        <option value="freigabe">Freigegeben</option>
      </select>
      <label title="Nur Durchbrüche, bei denen Sie als Nächstes etwas tun müssen"><input id="filter-ich" type="checkbox" checked> Wartet auf mich</label>
    </div>
    <div id="kennzahlen" class="kennzahlen"></div>
    <div id="liste" class="liste"></div>
  </aside>

  <section class="mitte">
    <div id="viewer" class="viewer" tabindex="0"></div>
    <div id="hinweis" class="hinweis"></div>
    <div class="legende">
      <span><i style="background:#EF9F27"></i>In Prüfung</span>
      <span><i style="background:#E24B4A"></i>Abgelehnt</span>
      <span><i style="background:#639922"></i>Freigegeben</span>
    </div>
  </section>

  <aside id="detail" class="rechts"></aside>
</main>

<div id="dialog" class="dialog-huelle" hidden></div>

<script type="module" src="app/main.js"></script>
</body>
</html>
