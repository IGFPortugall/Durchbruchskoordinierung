<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Durchbruchskoordinierung</title>
<link rel="stylesheet" href="app/stil.css">
<!-- Versionen fest: That Open 3.6, three 0.184, web-ifc 0.0.77 (passend zu That Open) -->
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.184.0",
    "three/": "https://esm.sh/three@0.184.0/",
    "camera-controls": "https://esm.sh/camera-controls@3.1.2?external=three",
    "web-ifc": "https://esm.sh/web-ifc@0.0.77",
    "@thatopen/fragments": "https://esm.sh/@thatopen/fragments@3.6.1?external=three,web-ifc",
    "@thatopen/components": "https://esm.sh/@thatopen/components@3.6.0?external=three,web-ifc,@thatopen/fragments,camera-controls"
  }
}
</script>
</head>
<body>
<header class="kopf">
  <div class="titel"><span id="projektname">Durchbruchskoordinierung</span></div>
  <div class="werkzeuge">
    <div class="segment" title="Ansicht umschalten – Auswahl und Ausschnitt bleiben erhalten">
      <button id="modus-3d" class="an">3D</button><button id="modus-plan">Grundriss</button>
    </div>
    <select id="geschoss" title="Geschoss: im 3D werden darüberliegende Geschosse ausgeblendet, im Grundriss wird 1,00 m über OKFF geschnitten"></select>
    <div class="trenner"></div>
    <select id="schnitt-wahl" class="schnitt-wahl" title="Gespeicherte Schnitte – umschalten (Liste links unter „Schnitte“)"></select>
    <button id="schnitt-ebene" title="Neuer Schnitt: danach auf eine Fläche klicken. Die Ebene am Pfeil verschieben. Esc bricht ab.">+ Schnitt</button>
    <button id="schnitt-box" title="Neue Schnittbox um den gewählten Durchbruch bzw. das gewählte Bauteil (sonst um die Bildmitte). Seiten links in der Liste verschieben.">+ Box</button>
    <div class="trenner"></div>
    <button id="alles" title="Alles zeigen">Alles zeigen</button>
    <button id="einstellungen" title="Navigation und Darstellung">Ansicht ⚙</button>
  </div>
  <button id="benutzer" class="benutzer" title="Name, Firma und Rolle ändern"></button>
</header>

<main class="haupt">
  <aside class="inhalte">
    <div class="i-kopf">Modelle</div>
    <div id="i-modelle" class="i-liste"></div>
    <div class="i-kopf" id="i-plaene-kopf" hidden>Pläne (2D)</div>
    <div id="i-plaene" class="i-liste"></div>
    <div class="i-kopf">Durchbrüche · Stände</div>
    <div id="i-staende" class="i-liste"></div>
    <label id="i-laden" class="i-laden" tabindex="0"
           title="IFC oder FBX (z. B. Architektur, Tragwerk) in den Projektordner laden – danach für alle sichtbar. Auch per Ziehen und Ablegen.">
      <input id="i-datei" type="file" accept=".ifc,.fbx" hidden>
      <b>+ Modell laden</b><span>IFC oder FBX hierher ziehen oder klicken</span>
    </label>
  </aside>

  <section class="mitte">
    <div id="viewer" class="viewer" tabindex="0"></div>
    <div id="panel" class="panel" hidden></div>
    <div class="werkzeugkasten">
      <div id="schnitt-pop" class="schnitt-pop" hidden>
        <div class="sp-kopf"><b>Schnitte</b>
          <span><button id="sp-ebene" title="Auf eine Fläche klicken – dort wird geschnitten">+ Schnitt</button>
          <button id="sp-box" title="Box um die Auswahl bzw. die Bildmitte">+ Box</button></span></div>
        <label class="sp-auto" title="Klick auf einen Durchbruch (Liste oder Modell) legt eine Schnittbox mit 2 m Abstand darum">
          <input type="checkbox" id="sp-auto"> Box um gewählten Durchbruch (2 m)</label>
        <div id="i-schnitte" class="i-liste"></div>
      </div>
      <button id="wk-schnitte" class="wk-knopf" title="Schnitte: anlegen, umschalten, umbenennen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4" opacity=".45"/><path d="M2 14h20" stroke-dasharray="3 2"/></svg>
        <span>Schnitte</span></button>
      <button id="wk-roentgen" class="wk-knopf" title="Röntgen: Modelle blass, Durchbrüche bleiben voll sichtbar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2" opacity=".45"/><rect x="9" y="9" width="6" height="6" fill="currentColor"/></svg>
        <span>Röntgen</span></button>
      <button id="wk-messen" class="wk-knopf" title="Messen: zwei Punkte anklicken (rastet auf Ecken ein). Nochmal klicken = Messungen löschen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg>
        <span>Messen</span></button>
    </div>
    <div id="hinweis" class="hinweis"></div>
    <div class="legende">
      <span><i style="background:#EF9F27"></i>In Prüfung</span>
      <span><i style="background:#E24B4A"></i>Abgelehnt</span>
      <span><i style="background:#639922"></i>Freigegeben</span>
    </div>
  </section>

  <aside class="rechts">
    <div class="r-liste">
      <input id="suche" type="search" placeholder="Nummer oder Text suchen">
      <div class="filter">
        <select id="filter-status" title="Nach Gesamtstatus filtern">
          <option value="">Alle Status</option>
          <option value="offen">In Prüfung</option>
          <option value="blockiert">Abgelehnt</option>
          <option value="freigabe">Freigegeben</option>
        </select>
        <label title="Nur Durchbrüche, bei denen Sie als Nächstes etwas tun müssen"><input id="filter-ich" type="checkbox" checked> Wartet auf mich</label>
      </div>
      <div id="kennzahlen" class="kennzahlen"></div>
      <div id="liste" class="liste"></div>
    </div>
    <div id="detail" class="r-detail"></div>
  </aside>
</main>

<div id="dialog" class="dialog-huelle" hidden></div>

<script type="module" src="app/main.js"></script>
</body>
</html>
